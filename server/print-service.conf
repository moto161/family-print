server
{
    listen 8765;
    server_name _;
    index index.html index.htm index.php;
    root /www/server/nginx/html/print;

    client_max_body_size 100m;

    # ============================================================
    # 安全加固（2026-10-08）——两条必须保留，删了就等于把服务器交出去
    # ============================================================

    # 1) 上传目录禁止任何 HTTP 访问。
    #    uploads/ 在 web root 下，若允许访问，攻击者上传 shell.php 后可直接执行（RCE）。
    #    打印流程只需要 PHP 内部读写该目录，不需要对外暴露。
    location ^~ /uploads/ {
        deny all;
        return 404;
    }

    # 2) 可选：IP 白名单。家庭宽带出口 IP 会变，默认注释；
    #    若你有固定出口 IP（或挂了 VPN/内网穿透），取消注释并填自己的 IP，多一层保险。
    # allow 203.0.113.10;      # ← 换成你家出口 IP（curl ifconfig.me 查看）
    # allow 127.0.0.1;
    # deny  all;

    # ============================================================

    # 仅允许 GET/POST，其余方法直接拒
    if ($request_method !~ ^(GET|POST)$) {
        return 405;
    }

    # 缩略图目录：只提供静态文件，绝不解析 PHP
    location ^~ /previews/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass  unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
    }

    # 版本更新用的静态 APK 目录（若也在本站点下），同样禁 PHP 解析
    location ^~ /apk/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }
}
